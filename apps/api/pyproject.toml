[project]
name = "meshmoose-api"
version = "0.1.0"
description = "MeshMoose.ai — multimodal reconstruction API + CLI on Zoo APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MeshMoose contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "kittycad>=1.4.0",
  "websockets>=14",
  "Pillow>=10.0",
  "pillow-heif>=0.16.0",
  "numpy>=2.0",
  "scipy>=1.11",
  "trimesh>=4.5.0",
  "lxml>=5.0",
  "networkx>=3.0",
  "zoo-kcl>=0.3.169",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/KoraiD/MeshMoose"
Repository = "https://github.com/KoraiD/MeshMoose"
Issues = "https://github.com/KoraiD/MeshMoose/issues"

[project.scripts]
meshmoose = "meshmoose_api.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: hits live Zoo APIs (needs ZOO_API_TOKEN)",
]
